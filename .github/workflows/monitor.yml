name: Beyblade X Stock Monitor

on:
  schedule:
    # 每10分鐘跑一次 (UTC時間，香港時間 = UTC+8)
    - cron: '*/10 * * * *'
  workflow_dispatch:  # 允許手動觸發測試

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Restore stock database cache
        uses: actions/cache@v4
        with:
          path: beyblade_stock.db
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-
      
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python beyblade_monitor.py
      
      - name: Upload database as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: stock-db-backup
          path: beyblade_stock.db
          retention-days: 30
